<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="券券日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>券券日記</title>
<style>
:root{
  --paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--mizu:#A8D3E6;--take:#B9DAA5;
  --white:#FFFFFF;--r:22px;--bw:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{
  font-family:"Huninn","Hiragino Maru Gothic ProN","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 100px) env(safe-area-inset-left);
  min-height:100vh;line-height:1.5;font-size:16px;
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px}
.hidden{display:none!important}

/* ---------- 共用元件 ---------- */
.card{border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;
  border:var(--bw) solid var(--ink);border-radius:999px;background:var(--yellow);box-shadow:0 3px 0 var(--ink);
  font-weight:700;text-decoration:none;cursor:pointer;user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.coral{background:var(--coral)} .btn.mizu{background:var(--mizu)} .btn.take{background:var(--take)}
.btn.plain{background:var(--paper)} .btn.small{min-height:36px;padding:4px 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;border:var(--bw) solid var(--ink);border-radius:50%;background:var(--paper);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:700;padding:0}
.iconbtn:active{transform:translateY(2px)}
.chip{display:inline-block;padding:0 9px;border:2px solid var(--ink);border-radius:999px;font-size:12px;background:var(--paper);white-space:nowrap}
.chip.mizu{background:var(--mizu)} .chip.take{background:var(--take)} .chip.coral{background:var(--coral)} .chip.yellow{background:var(--yellow)}
.muted{opacity:.7;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

/* ---------- 頁首 ---------- */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.top h1{margin:0;font-size:26px;letter-spacing:2px}
.mascot{width:64px;height:64px;flex:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--take)}
.status.warn{background:var(--coral)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink);display:inline-block}

/* ---------- 首頁 ---------- */
.search{width:100%;min-height:46px;padding:8px 16px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--white);outline:none}
.search:focus{box-shadow:0 0 0 4px var(--mizu)}
.tabs{display:flex;gap:6px;margin:14px 0;padding:4px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--white)}
.tabs button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--yellow);box-shadow:inset 0 0 0 2px var(--ink)}
.tabs .n{font-size:12px;opacity:.75;margin-left:2px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;margin:0 0 12px;border:var(--bw) solid var(--ink);border-radius:18px;background:var(--yellow);font-weight:700;cursor:pointer}
.banner.coral{background:var(--coral)}
.banner svg{flex:none}
.sec{margin:18px 4px 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec small{font-weight:400;opacity:.7}
.list{display:flex;flex-direction:column;gap:12px}
.tcard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;text-decoration:none}
.tcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tcard.is-used{opacity:.6}
.tcard.is-exp{border-style:dashed}
.cat{width:52px;height:52px;display:block}
.cat svg{width:52px;height:52px;display:block}
.ttl{display:block;font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.date{display:block;font-size:13px;opacity:.8}
.dpill{min-width:64px;text-align:center;padding:6px 8px;border:var(--bw) solid var(--ink);border-radius:14px;font-size:13px;font-weight:700;line-height:1.2;background:var(--take)}
.d-urgent{background:var(--coral)} .d-soon{background:var(--yellow)} .d-none{background:var(--paper)}
.d-exp{background:var(--paper);border-style:dashed} .d-used{background:var(--paper)}
.empty{text-align:center;padding:30px 10px}
.empty svg{width:140px;height:140px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));
  width:66px;height:66px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--coral);box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;text-decoration:none}
.fab:active{transform:translateY(4px);box-shadow:none}
.foot{margin-top:28px;padding:12px 14px;border:2px dashed var(--ink);border-radius:18px;font-size:13px}

/* ---------- 子頁 ---------- */
.bar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.bar h2{margin:0;font-size:20px;flex:1}
.panel{padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:16px}
.ways{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.way{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:var(--bw) solid var(--ink);border-radius:18px;background:var(--white);cursor:pointer;font-weight:700;font-size:14px;text-align:center;position:relative}
.way:active{transform:translateY(2px)}
.way svg{width:34px;height:34px}
.way.off{opacity:.5;cursor:default}
.way input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:1}
.way .soon{position:absolute;top:-9px;right:-4px;font-size:11px}
.pastebox{margin-top:10px;min-height:70px;padding:12px;border:var(--bw) dashed var(--ink);border-radius:16px;background:var(--white);text-align:center;outline:none;-webkit-user-select:text;user-select:text}
.imgs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.imgrow{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:8px;border:2px solid var(--ink);border-radius:16px;background:var(--white)}
.imgrow img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid var(--ink);background:#fff}
.imgrow .ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imgrow select{min-height:36px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:2px 6px}
.imgrow .iconbtn{width:34px;height:34px;font-size:15px;border-width:2px}
.imgrow .iconbtn.on{background:var(--yellow)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14px;font-weight:700;margin:0 0 4px 4px}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:8px 14px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--white);outline:none;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 4px var(--mizu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>*{min-width:0}.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:6px 14px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--white);font-size:14px;font-weight:700}
.seg input:checked+span{background:var(--yellow)}
.seg input:focus-visible+span{box-shadow:0 0 0 4px var(--mizu)}
.hint{font-size:13px;opacity:.75;margin:6px 4px 0}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));margin-top:16px;display:flex;gap:10px}
.savebar .btn{flex:1}

/* 詳細頁 */
.hero{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:14px}
.hero .cat,.hero .cat svg{width:64px;height:64px}
.hero h2{margin:0;font-size:20px;line-height:1.3;word-break:break-word}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.slide{flex:0 0 86%;scroll-snap-align:center;border:var(--bw) solid var(--ink);border-radius:18px;background:#fff;overflow:hidden;position:relative;cursor:zoom-in}
.slide img{display:block;width:100%;height:300px;object-fit:contain;background:#fff}
.slide .chip{position:absolute;left:8px;top:8px}
.slide .star{position:absolute;left:auto;right:8px;top:8px}
.nofile{height:300px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--paper);font-size:14px}
.status{text-decoration:none}.status.yellow{background:var(--yellow)}
.acct-state{display:flex;gap:10px;align-items:flex-start}
.acct-state .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);margin-top:5px;flex:none}
.cfield{padding:10px;border:2px solid var(--ink);border-radius:16px;background:var(--white);margin-top:10px}
.cfield .opt{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:12px;cursor:pointer}
.cfield .opt input{margin-top:5px;width:18px;height:18px;accent-color:#3E3A39}
.cfield .opt:has(input:checked){background:var(--yellow)}
.sheet{max-height:92vh;overflow:auto}
.maskwrap{display:flex;justify-content:center}
.maskwrap canvas{max-width:100%;max-height:55vh;touch-action:none;border:var(--bw) solid var(--ink);border-radius:12px;background:#fff}
.busy{text-align:center;padding:6px 0}
.busy-mascot{width:110px;height:110px}
.busy p{font-weight:700;margin:6px 0 12px}
.pbar{height:16px;border:var(--bw) solid var(--ink);border-radius:999px;overflow:hidden;background:var(--white)}
.pbar i{display:block;height:100%;width:0;background:var(--coral);transition:width .2s}
.recog{padding:12px 14px;margin:0 0 14px;border:var(--bw) solid var(--ink);border-radius:18px;background:#FFF3C4;box-shadow:0 4px 0 var(--ink)}
.recog .hint{opacity:.85}
.warnline{font-weight:700;opacity:1!important}
.field .ai-filled,.ai-filled{background:#FFF3C4!important}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:15px}
.kv dt{font-weight:700;opacity:.8}
.kv dd{margin:0;word-break:break-all}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}

/* 全螢幕原圖 */
.viewer{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column}
.viewer .vbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:var(--bw) solid var(--ink);background:var(--paper)}
.viewer .vimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#fff;touch-action:pan-x pan-y pinch-zoom}
.viewer .vimg img{max-width:100%;max-height:100%;image-rendering:auto}
.viewer .vimg.zoom{align-items:flex-start;justify-content:flex-start}
.viewer .vimg.zoom img{max-width:none;max-height:none}
.viewer .vnav{display:flex;justify-content:space-between;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:var(--bw) solid var(--ink);background:var(--paper)}

/* 對話框與提示 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(62,58,57,.35);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .card{width:100%;max-width:440px;padding:18px;margin-bottom:env(safe-area-inset-bottom)}
.modal p{margin:0 0 14px;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;
  max-width:92vw;padding:10px 16px;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 3px 0 var(--ink);
  display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}

/* ---------- 動畫 ---------- */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(12deg)}94%{transform:rotate(-6deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-3px);opacity:.4}}
@keyframes bounceIn{0%{transform:translateY(16px) scale(.97);opacity:0}60%{transform:translateY(-6px) scale(1.01);opacity:1}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.anim-float{animation:floaty 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.anim-wiggle{animation:wiggle 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 10%}
.anim-blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.anim-steam{animation:steam 2.4s ease-in-out infinite}
.bounce .tcard,.bounce .sec,.bounce .empty{animation:bounceIn .5s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(min(var(--i,0),8) * 45ms)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (min-width:720px){ .slide{flex-basis:60%} }
</style>
</head>

<div class="wrap" id="app" aria-live="polite"></div>
<a class="fab" href="#add" id="fab" aria-label="新增票券">
  <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 5v24M5 17h24" stroke="#3E3A39" stroke-width="5" stroke-linecap="round"/></svg>
</a>
<div id="layer"></div>

<script src="config.js"></script>
<script>
'use strict';
/* =========================================================
   券券日記・階段一
   本機資料層（IndexedDB，失敗時退回記憶體暫存）、票券管理、
   獨立 QR Code、多圖片、原圖檢視、跨平台到期排序
   ========================================================= */

const TZ = 'Asia/Taipei';
const INK = '#3E3A39';
const PLATFORMS = [
  { id: 'yahoo',  name: 'Yahoo購物中心', home: 'https://tw.buy.yahoo.com/' },
  { id: 'momo',   name: 'momo購物網',   home: 'https://www.momoshop.com.tw/' },
  { id: 'pchome', name: 'PChome 24h',  home: 'https://24h.pchome.com.tw/' },
  { id: 'shopee', name: '蝦皮購物',      home: 'https://shopee.tw/' },
  { id: 'line',   name: 'LINE禮物',     home: 'https://gift.line.me/' },
  { id: 'other',  name: '其他',          home: '' },
];
const CATS = [['coffee','咖啡飲料'],['food','餐廳美食'],['store','超商量販'],['movie','電影娛樂'],['gift','禮物百貨'],['other','其他']];
const KINDS = [['info','票券資訊'],['qr','QR Code'],['barcode','條碼'],['guide','使用說明'],['other','其他']];
const REMIND_PRESETS = [[0,'當天'],[1,'前 1 天'],[3,'前 3 天'],[7,'前 7 天'],[14,'前 14 天']];

/* ---------- 小工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
};
const nowISO = () => new Date().toISOString();
const isCode = k => k === 'qr' || k === 'barcode';
function safeUrl(u) {
  if (!u) return null;
  try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; } catch { return null; }
}

/* ---------- 日期（全部以台北時區的「日期字串」計算，避免 UTC 提前一天） ---------- */
const fmtDay = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtHM  = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const today = () => fmtDay.format(new Date());               // 'YYYY-MM-DD'
const nowHM = () => fmtHM.format(new Date());                // 'HH:MM'
const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const WEEK = '日一二三四五六';
function fmtDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}（${WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}）`;
}
function daysLeft(t) { return t.expires_on ? dayNum(t.expires_on) - dayNum(today()) : null; }
function isExpired(t) {
  const d = daysLeft(t);
  if (d === null) return false;
  if (d < 0) return true;
  // 只有日期、沒有時間時，當天整天都視為有效，不自行假設 23:59
  return d === 0 && !!t.expires_time && nowHM() > t.expires_time;
}
// 全域排序：只看有效期限，不看平台或分類
function byExpiry(a, b) {
  const ka = (a.expires_on || '9999-12-31') + ' ' + (a.expires_time || '99:99');
  const kb = (b.expires_on || '9999-12-31') + ' ' + (b.expires_time || '99:99');
  return ka < kb ? -1 : ka > kb ? 1 : (a.created_at < b.created_at ? -1 : 1);
}

/* ---------- 本機資料層 ---------- */
const STORES = { tickets: 'id', ticket_images: 'id', blobs: 'hash', sync_queue: 'id', meta: 'key', sync_base: 'key', conflicts: 'key', ai_cache: 'key' };
const DB = { mode: 'idb', db: null, mem: {} };
for (const k of Object.keys(STORES)) DB.mem[k] = new Map();

async function openDB() {
  try {
    if (!window.indexedDB) throw new Error('no idb');
    DB.db = await new Promise((res, rej) => {
      const r = indexedDB.open('quanquan', 3);
      const timer = setTimeout(() => rej(new Error('timeout')), 5000);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const [name, key] of Object.entries(STORES)) {
          if (d.objectStoreNames.contains(name)) continue;
          const s = d.createObjectStore(name, { keyPath: key });
          if (name === 'ticket_images') { s.createIndex('ticket_id', 'ticket_id'); s.createIndex('hash', 'hash'); }
        }
      };
      r.onsuccess = () => { clearTimeout(timer); res(r.result); };
      r.onerror = () => { clearTimeout(timer); rej(r.error); };
    });
    // 實際寫讀一次，確認這個環境真的能存
    await write([{ store: 'meta', value: { key: 'probe', at: nowISO() } }]);
  } catch (e) {
    DB.mode = 'memory'; DB.db = null;
  }
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
}
function idbReq(store, fn) {
  return new Promise((res, rej) => {
    const t = DB.db.transaction(store, 'readonly');
    const r = fn(t.objectStore(store));
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function all(store) {
  if (DB.mode === 'memory') return [...DB.mem[store].values()].map(v => ({ ...v }));
  return idbReq(store, s => s.getAll());
}
async function get(store, key) {
  if (DB.mode === 'memory') { const v = DB.mem[store].get(key); return v ? { ...v } : undefined; }
  return idbReq(store, s => s.get(key));
}
// 多筆寫入放在同一個交易：要嘛全部成功，要嘛全部不寫
async function write(ops, opts = {}) {
  if (!ops.length) return;
  await rawWrite(ops);
  // 使用者的修改寫進本機後，才排入雲端同步
  if (!opts.fromSync && window.Sync && ops.some(o => o.store === 'tickets' || o.store === 'ticket_images' || o.store === 'blobs')) window.Sync.schedule();
}
async function rawWrite(ops) {
  if (DB.mode === 'memory') {
    for (const o of ops) o.del ? DB.mem[o.store].delete(o.del) : DB.mem[o.store].set(o.value[STORES[o.store]], { ...o.value });
    return;
  }
  const names = [...new Set(ops.map(o => o.store))];
  await new Promise((res, rej) => {
    const t = DB.db.transaction(names, 'readwrite');
    for (const o of ops) { const s = t.objectStore(o.store); o.del ? s.delete(o.del) : s.put(o.value); }
    t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
  });
}
// 階段二的同步會讀這個佇列，現在先把每一筆修改記下來
const queueOp = (table, id, op) => ({ store: 'sync_queue', value: { id: uuid(), table, record_id: id, op, at: nowISO() } });

async function sha256(blob) {
  try {
    const buf = await blob.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return 'nohash-' + uuid(); }
}
const urlCache = new Map();
async function blobUrl(hash) {
  if (urlCache.has(hash)) return urlCache.get(hash);
  const rec = await get('blobs', hash);
  if (!rec) return '';
  const b = rec.blob || (rec.data ? new Blob([rec.data], { type: rec.type || 'image/jpeg' }) : null);
  if (!b) return '';
  const u = URL.createObjectURL(b);
  urlCache.set(hash, u);
  return u;
}

// 把目前讀得到的資料搬到記憶體，之後都寫在記憶體裡
async function fallbackToMemory() {
  for (const name of Object.keys(STORES)) {
    let rows = [];
    try { rows = await all(name); } catch {}
    for (const r of rows) DB.mem[name].set(r[STORES[name]], r);
  }
  DB.mode = 'memory'; DB.db = null;
}

function cardHTML(t, i, gcount) {
  const d = daysLeft(t), exp = isExpired(t), used = t.status === 'used';
  let cls = 'd-ok', txt;
  if (used) { cls = 'd-used'; txt = '已使用'; }
  else if (d === null) { cls = 'd-none'; txt = '無期限'; }
  else if (exp) { cls = 'd-exp'; txt = d < 0 ? `過期<br>${-d} 天` : '已過期'; }
  else if (d === 0) { cls = 'd-urgent'; txt = '今天<br>到期'; }
  else if (d <= 3) { cls = 'd-urgent'; txt = `剩 ${d} 天`; }
  else if (d <= 7) { cls = 'd-soon'; txt = `剩 ${d} 天`; }
  else txt = `剩 ${d} 天`;
  const imgs = imagesOf(t.id);
  const hasCode = imgs.some(x => isCode(x.kind));
  const batch = t.batch_total > 1 ? `<span class="chip mizu">第 ${t.batch_index}/${t.batch_total} 張</span>`
              : (gcount > 1 && !used ? `<span class="chip mizu">同商品 ${gcount} 張</span>` : '');
  return `<a class="card tcard ${used ? 'is-used' : ''} ${exp && !used ? 'is-exp' : ''}" href="#t-${t.id}" style="--i:${i}">
    <span class="cat">${catSVG(t.category)}</span>
    <span style="min-width:0"><b class="ttl">${esc(t.title)}</b>
      <span class="meta"><span class="chip">${esc(platName(t))}</span>${batch}${hasCode ? '<span class="chip take">QR</span>' : ''}</span>

    <span class="dpill ${cls}">${txt}</span></a>`;
}

async function showUsage() {
  try {
    if (!navigator.storage || !navigator.storage.estimate) return;
    const e = await navigator.storage.estimate();

    const el = $('#usage'); if (!el) return;
    el.textContent = `已使用約 ${(e.usage / 1048576).toFixed(1)} MB${persisted ? '・已申請持久保存' : ''}`;

}

  $('#back').onclick = () => history.length > 1 ? history.back() : go('home');

  $('#btnRecog').onclick = () => window.Recog ? Recog.start() : toast('辨識功能載入中，請稍候');
  S.draft.userSet = new Set();
  $('#form').addEventListener('change', e => { if (e.isTrusted && e.target.name) S.draft.userSet.add(e.target.name); });
  $('#form').addEventListener('input', e => e.target.classList && e.target.classList.remove('ai-filled'));
  app.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = () => {
    S.draft.mode = r.value;
    if (r.value === 'multi') S.draft.images.forEach(im => { if (im.kind === 'info' && !im.touched) im.kind = 'qr'; });
    drawImages();
  });
  $('#form').addEventListener('submit', e => { e.preventDefault(); saveDraft(e.target); });
  drawImages();
}

function drawImages() {
  const d = S.draft;
  const box = $('#imgList'); if (!box) return;
  if (!d.images.some(x => x.primary) && d.images.length) {
    (d.images.find(x => isCode(x.kind)) || d.images[0]).primary = true;
  }
  box.innerHTML = d.images.map((im, i) => `
    <div class="imgrow" data-k="${im.k}">
      <img src="${im.url}" alt="${kindName(im.kind)}">
      <div class="ctrl">
        <select data-act="kind" aria-label="圖片類型">${KINDS.map(([k, n]) => `<option value="${k}" ${k === im.kind ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <button type="button" class="iconbtn ${im.primary ? 'on' : ''}" data-act="primary" aria-label="設為主要圖片">${im.primary ? '★' : '☆'}</button>
        <button type="button" class="iconbtn" data-act="up" aria-label="往前" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="iconbtn" data-act="down" aria-label="往後" ${i === d.images.length - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="iconbtn" data-act="del" aria-label="移除">✕</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('[data-act]').forEach(el => {
    const k = el.closest('[data-k]').dataset.k;
    const idx = d.images.findIndex(x => x.k === k);
    const im = d.images[idx];
    const act = el.dataset.act;
    if (act === 'kind') el.onchange = () => { im.kind = el.value; im.touched = true; drawImages(); };
    else el.onclick = async () => {
      if (act === 'primary') { d.images.forEach(x => x.primary = false); im.primary = true; }
      if (act === 'up' && idx > 0) [d.images[idx - 1], d.images[idx]] = [d.images[idx], d.images[idx - 1]];
      if (act === 'down' && idx < d.images.length - 1) [d.images[idx + 1], d.images[idx]] = [d.images[idx], d.images[idx + 1]];
      if (act === 'del') {
        if (im.existingId) {
          const others = S.images.filter(x => x.hash === im.hash && x.ticket_id !== d.editId).length;
          const ok = await ask(others
            ? `這張圖片也被其他 ${others} 張票券使用。\n只會從這張票券移除，其他票券不受影響。`
            : '確定移除這張圖片嗎？\n按「儲存票券」後才會真正刪除。', '移除', true);
          if (!ok) return;
        }
        d.images.splice(idx, 1);
      }
      drawImages();
    };
  });
  // 多張模式說明
  const mh = $('#multiHint');
  if (mh) {
    const n = d.images.filter(x => isCode(x.kind)).length;
    $('#multiBox').classList.toggle('hidden', d.mode !== 'multi');
    $('#countField').classList.toggle('hidden', n >= 2);
    mh.textContent = n >= 2
      ? `會建立 ${n} 張獨立票券，每張各自一張 QR／條碼，可以分別標記已使用。其他類型的圖片（票券資訊、使用說明）會共用。`
      : '每一張 QR Code 或條碼圖片會變成一張獨立票券。還沒有圖片的話，可以先填張數，之後再到各張票券補上 QR。';
  }
}

function addFiles(files) {
  const imgs = files.filter(f => f && ((f.type && f.type.startsWith('image/')) || (!f.type && /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(f.name || ''))));
  if (!imgs.length) return toast('沒有找到圖片檔');
  for (const f of imgs) {
    S.draft.images.push({ k: uuid(), file: f, kind: S.draft.mode === 'multi' ? 'qr' : (S.draft.images.length ? 'qr' : 'info'), primary: false, url: URL.createObjectURL(f) });
  }
  drawImages();
  toast(`已加入 ${imgs.length} 張圖片，請確認圖片類型`);
}
async function pasteFromClipboard() {
  try {
    if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('unsupported');
    const items = await navigator.clipboard.read();
    const files = [];
    let text = '';
    for (const it of items) {
      const type = it.types.find(t => t.startsWith('image/'));
      if (type) { const b = await it.getType(type); files.push(new File([b], 'paste.' + type.split('/')[1], { type })); }
      else if (it.types.includes('text/plain')) text = await (await it.getType('text/plain')).text();
    }
    if (files.length) return addFiles(files);
    if (text) return handlePastedText(text);
    toast('剪貼簿裡沒有圖片');
  } catch {
    // 瀏覽器不允許直接讀取：改用系統的「貼上」選單
    const box = $('#pasteBox');
    box.classList.remove('hidden');
    box.focus();
    toast('請在虛線框長按並選「貼上」');
  }
}
function handlePastedText(text) {
  const url = safeUrl((text.match(/https?:\/\/\S+/) || [])[0]);
  const f = $('#form'); if (!f) return;
  if (url && !f.original_url.value) { f.original_url.value = url; toast('已填入原始票券網址'); }
  else if (!f.note.value) { f.note.value = text.slice(0, 500); toast('已貼到備註，請手動整理'); }
}
// 系統「貼上」：任何時候在新增頁按下貼上都會收進來
document.addEventListener('paste', e => {
  if (!S.draft || !$('#form')) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  const inBox = e.target.closest && e.target.closest('#pasteBox');
  if (files.length) { e.preventDefault(); addFiles(files); $('#pasteBox').classList.add('hidden'); return; }
  if (inBox) {
    e.preventDefault();
    const text = e.clipboardData?.getData('text/plain');
    if (text) handlePastedText(text); else toast('剪貼簿裡沒有圖片，請改用上傳截圖');
    $('#pasteBox').classList.add('hidden');
  }
});

async function saveDraft(form) {
  const btn = $('#btnSave');
  const fd = new FormData(form);
  const v = k => (fd.get(k) || '').toString().trim();
  const d = S.draft;
  const title = v('title');
  if (!title) { form.title.focus(); return toast('請填寫票券名稱'); }
  for (const k of ['original_url', 'order_url']) if (v(k) && !safeUrl(v(k))) { form[k].focus(); return toast('網址需要以 https:// 開頭'); }
  const reminders = [...new Set([...fd.getAll('rem').map(Number),
    ...v('rem_custom').split(/[,\s，、]+/).map(Number).filter(n => Number.isInteger(n) && n > 0 && n <= 365)])].sort((a, b) => a - b);
  const base = {
    title, platform: v('platform'), platform_name: v('platform') === 'other' ? v('platform_name') : '',
    category: v('category'), expires_on: v('expires_on') || null, expires_time: v('expires_time') || null,
    value: v('value'), order_no: v('order_no'), original_url: v('original_url'), order_url: v('order_url'),
    redeem_code: v('redeem_code'), note: v('note'), reminders, remind_time: v('remind_time') || '09:00', timezone: TZ,
  };

  const codes = d.images.filter(x => isCode(x.kind));
  if (!d.editId && d.mode === 'multi') {
    if (codes.length === 1) return toast('多張模式需要 2 張以上 QR／條碼圖片，或改成單張');
    if (codes.length === 0) { const c = parseInt(v('count'), 10); if (!(c >= 2 && c <= 50)) return toast('張數請填 2～50'); }
  }

  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    const now = nowISO();
    const ops = [];
    // 圖片：用 SHA-256 去重，相同檔案只存一份
    for (const im of d.images) if (!im.hash) im.hash = await sha256(im.file);
    const added = new Set();
    for (const im of d.images) {
      if (!im.file || added.has(im.hash)) continue;
      added.add(im.hash);
      if (!(await get('blobs', im.hash))) ops.push({ store: 'blobs', value: { hash: im.hash, data: await im.file.arrayBuffer(), type: im.file.type || 'image/jpeg', size: im.file.size, created_at: now } });
    }
    const imgRec = (ticketId, im, sort, primary) => ({ id: uuid(), ticket_id: ticketId, hash: im.hash, kind: im.kind, sort, is_primary: primary, created_at: now, updated_at: now, version: 1, deleted_at: null });
    const newTicket = extra => ({ id: uuid(), ...base, ticket_type: 'single', batch_id: null, batch_index: 1, batch_total: 1, status: 'active', used_at: null, created_at: now, updated_at: now, version: 1, deleted_at: null, ...extra });

    let goTo = 'home', msg = '已儲存';
    let removedHashes = [];
    if (d.editId) {
      const old = S.tickets.find(x => x.id === d.editId);
      ops.push({ store: 'tickets', value: { ...old, ...base, updated_at: now, version: (old.version || 1) + 1 } }, queueOp('tickets', old.id, 'update'));
      const existing = imagesOf(old.id);
      const keep = new Set(d.images.filter(x => x.existingId).map(x => x.existingId));
      for (const r of existing) if (!keep.has(r.id)) {
        ops.push({ store: 'ticket_images', value: { ...r, deleted_at: now, updated_at: now, version: (r.version || 1) + 1 } }, queueOp('ticket_images', r.id, 'delete'));
        removedHashes.push(r.hash);
      }
      d.images.forEach((im, i) => {
        if (im.existingId) {
          const r = existing.find(x => x.id === im.existingId);
          if (r.kind !== im.kind || r.sort !== i || !!r.is_primary !== im.primary) {
            ops.push({ store: 'ticket_images', value: { ...r, kind: im.kind, sort: i, is_primary: im.primary, updated_at: now, version: (r.version || 1) + 1 } }, queueOp('ticket_images', r.id, 'update'));
          }
        } else {
          const r = imgRec(old.id, im, i, im.primary);
          ops.push({ store: 'ticket_images', value: r }, queueOp('ticket_images', r.id, 'insert'));
        }
      });
      goTo = 't-' + old.id;
    } else if (d.mode === 'multi') {
      const shared = d.images.filter(x => !isCode(x.kind));
      const n = codes.length >= 2 ? codes.length : parseInt(v('count'), 10);
      const batch = uuid();
      for (let i = 0; i < n; i++) {
        const t = newTicket({ ticket_type: 'multi', batch_id: batch, batch_index: i + 1, batch_total: n });
        ops.push({ store: 'tickets', value: t }, queueOp('tickets', t.id, 'insert'));
        const list = codes[i] ? [codes[i], ...shared] : shared;
        list.forEach((im, j) => {
          const r = imgRec(t.id, im, j, j === 0 ? true : false);
          ops.push({ store: 'ticket_images', value: r }, queueOp('ticket_images', r.id, 'insert'));
        });
      }
      msg = `已建立 ${n} 張獨立票券`;
    } else {
      const t = newTicket({});
      ops.push({ store: 'tickets', value: t }, queueOp('tickets', t.id, 'insert'));
      d.images.forEach((im, i) => {
        const r = imgRec(t.id, im, i, im.primary);
        ops.push({ store: 'ticket_images', value: r }, queueOp('ticket_images', r.id, 'insert'));
      });
      goTo = 't-' + t.id;
    }
    try {
      await write(ops);              // 先安全寫進本機，才離開這頁
    } catch (e) {
      // 這個環境不讓存（例如在預覽框、無痕模式或空間不足）：改用暫存模式，至少這次操作不會失敗
      if (DB.mode !== 'idb') throw e;
      console.warn('IndexedDB 寫入失敗，改用暫存模式', e);
      await fallbackToMemory();
      await write(ops);
      msg += '（此環境無法永久保存，已改用暫存模式）';
    }
    await load();
    await gcBlobs(removedHashes);
    if (d.recog && window.Recog) await Recog.confirm(d.recog).catch(() => {});
    S.draft = null;
    toast(msg);
    history.replaceState(null, '', '#' + goTo);
    route();
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = '儲存票券';
    toast('儲存失敗：' + ((err && (err.name || err.message)) || '未知錯誤') + '，請截圖這個訊息給我');
  }
}
// 只有在完全沒有任何票券引用時，才刪除圖片檔案
async function gcBlobs(hashes) {
  if (!hashes.length) return;
  const live = (await all('ticket_images')).filter(i => !i.deleted_at);
  const ops = [];
  for (const h of new Set(hashes)) if (!live.some(i => i.hash === h)) { ops.push({ store: 'blobs', del: h }); urlCache.delete(h); }
  await write(ops);
}

function openViewer(list, urls, i) {
  closeViewer();
  const v = document.createElement('div');
  v.className = 'viewer'; v.id = 'viewer'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true');
  const draw = () => {
    v.innerHTML = `<div class="vbar"><button class="iconbtn" data-a="x" aria-label="關閉">✕</button>
        <b class="grow">${kindName(list[i].kind)}</b><button class="btn small plain" data-a="z">放大</button></div>
      <div class="vimg">${urls[i] ? `<img src="${urls[i]}" alt="${kindName(list[i].kind)} 原圖">` : '<div class="nofile">圖片尚未下載</div>'}</div>
      <div class="vnav"><button class="iconbtn" data-a="p" ${i === 0 ? 'disabled' : ''} aria-label="上一張">‹</button>
        <span class="muted">${i + 1} / ${list.length}・請調高螢幕亮度</span>
        <button class="iconbtn" data-a="n" ${i === list.length - 1 ? 'disabled' : ''} aria-label="下一張">›</button></div>`;
  };
  v.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'x') closeViewer();
    if (a.dataset.a === 'z') { const b = v.querySelector('.vimg'); b.classList.toggle('zoom'); a.textContent = b.classList.contains('zoom') ? '縮小' : '放大'; }
    if (a.dataset.a === 'p' && i > 0) { i--; draw(); }
    if (a.dataset.a === 'n' && i < list.length - 1) { i++; draw(); }
  });
  let sx = null;
  v.addEventListener('touchstart', e => { sx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  v.addEventListener('touchend', e => {
    if (sx === null || v.querySelector('.vimg.zoom')) return;
    const dx = e.changedTouches[0].clientX - sx;
    if (dx < -60 && i < list.length - 1) { i++; draw(); } else if (dx > 60 && i > 0) { i--; draw(); }
  });
  draw();
  document.body.appendChild(v);
  document.body.style.overflow = 'hidden';
}
function closeViewer() { const v = $('#viewer'); if (v) v.remove(); document.body.style.overflow = ''; }

function authErr(err) {

  if (/rate|too many|seconds/i.test(m)) return '寄送太頻繁，請稍等一下再試';
  if (/expired|invalid|token/i.test(m)) return '驗證碼錯誤或已過期，請重新寄送';
  if (/fetch|network/i.test(m)) return '無法連線到雲端，請檢查網路';
  return '登入失敗：' + m;
}
function fmtVal(f, v) {

  if (f === 'reminders') return v && v.length ? v.map(n => n === 0 ? '當天' : `前 ${n} 天`).join('、') : '不提醒';
  if (f === 'used_at') return v ? new Date(v).toLocaleString('zh-TW', { timeZone: TZ }) : '（無）';
  if (f === 'is_primary') return v ? '是' : '否';
  return v === null || v === undefined || v === '' ? '（空白）' : String(v);
}

    const box = $('#acctStatus'); if (box) box.innerHTML = acctStatusHTML();
    const h = location.hash.slice(1) || 'home';
    if (h === 'home' && !!$('.banner.coral[href="#conflicts"]') !== !!Sync.status.conflicts) route(true);
  });
  if (window.Sync) hookSync(); else window.addEventListener('load', hookSync, { once: true });
  // 跨午夜時重新計算剩餘天數
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!S.draft) route(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); if (!S.draft) route(); } });
})();
</script>
<script src="sync.js"></script>
<script src="recognize.js"></script>
</body>
